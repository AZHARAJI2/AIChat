<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة تحليل المحادثات</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- WordCloud -->
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.1.2/src/wordcloud2.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, #0b1d2a, #0f2a44, #1b3b5a);
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    .top-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px 15px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    button {
      background: linear-gradient(135deg, #2196f3, #21cbf3);
      color: white;
      cursor: pointer;
    }

    .dashboard {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 20px;
      width: 32%;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      text-align: center;
    }

    canvas {
      max-width: 100%;
    }

    #wordCloud {
      width: 100%;
      height: 300px;
    }
  </style>
</head>

<body>

<h1>لوحة تحليل المحادثات (تدرجات كحلي + أزرق + رمادي)</h1>

<div class="top-bar">
  <input type="file">
  <input type="text" placeholder="ادخل سؤال للتحليل">
  <button>تحليل</button>
</div>

<div class="dashboard">
  <div class="card">
    <canvas id="pieChart"></canvas>
  </div>

  <div class="card">
    <canvas id="barChart"></canvas>
  </div>

  <div class="card">
    <h3>☁️ سحابة الكلمات</h3>
    <canvas id="wordCloud"></canvas>
  </div>
</div>

<script>
/* Pie Chart */
new Chart(document.getElementById('pieChart'), {
  type: 'pie',
  data: {
    labels: ['تقني', 'أدبي', 'حياتي', 'ديني', 'علمي'],
    datasets: [{
      data: [40, 20, 15, 10, 15],
      backgroundColor: [
        '#64b5f6',
        '#4dd0e1',
        '#81c784',
        '#ff8a65',
        '#9575cd'
      ]
    }]
  },
  options: {
    plugins: {
      legend: {
        labels: { color: 'white' }
      }
    }
  }
});

/* Bar Chart */
new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: ['1','2','3','4','5'],
    datasets: [{
      label: 'عدد الأسئلة',
      data: [8, 12, 4, 6, 3],
      backgroundColor: '#64b5f6'
    }]
  },
  options: {
    scales: {
      x: { ticks: { color: 'white' } },
      y: { ticks: { color: 'white' } }
    },
    plugins: {
      legend: { labels: { color: 'white' } }
    }
  }
});

/* Word Cloud */
const words = [
  ['ذكاء اصطناعي', 40],
  ['برمجة', 30],
  ['شبكات', 20],
  ['تعلم', 25],
  ['تحليل', 18],
  ['بيانات', 22],
  ['سؤال', 15],
  ['خوارزميات', 17]
];

WordCloud(document.getElementById('wordCloud'), {
  list: words,
  gridSize: 12,          // توزيع أفضل داخل نفس المساحة
  weightFactor: 4,      // حجم مناسب بدون تضخيم
  fontFamily: 'Cairo',
  color: function () {
    return ['#64b5f6', '#4dd0e1', '#81c784', '#ffb74d', '#9575cd']
      [Math.floor(Math.random() * 5)];
  },
  rotateRatio: 0,       // بدون تدوير (أوضح)
  backgroundColor: 'transparent',
  drawOutOfBound: false,
  shrinkToFit: true
});

</script>

</body>
</html>
